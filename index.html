<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOST FREQ</title>
    <link rel="stylesheet" href="style.css">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>

<body>
    
<video id="bgVideo" autoplay muted loop playsinline>
    <source src="videos/highway.mp4" type="video/mp4">
</video>

    <header class="topbar">
        <a class="brand" href="#">LOST FREQ<span></span></a>
        <span class="track-count">SOUND WITHOUT BORDERS</span>
    </header>

    <main class="hero">
        <p class="eyebrow">YOUR NEXT OBSESSION IS A CLICK AWAY</p>

        <h1>LOST<br>FREQ</h1>

        <p class="tagline">Tune into the unknown.</p>

<div class="genre-selector">
    <p>CHOOSE YOUR GENRE</p>

    <div class="genre-options">
        <button class="genre-btn active" data-genre="All">All</button>
        <button class="genre-btn" data-genre="Rock">Rock</button>
        <button class="genre-btn" data-genre="Metal">Metal</button>
        <button class="genre-btn" data-genre="Grunge">Grunge</button>
        <button class="genre-btn" data-genre="Alternative">Alternative</button>
        <button class="genre-btn" data-genre="Indie">Indie</button>
        <button class="genre-btn" data-genre="Pop">Pop</button>
        <button class="genre-btn" data-genre="Bollywood">Bollywood</button>
        <button class="genre-btn" data-genre="Others">Others</button>
    </div>
</div>

        <button id="discoverBtn">Discover a song ↗</button>

      
<div id="musicCard" class="music-card" hidden>
    <button id="closeMusicCard" class="close-card" aria-label="Close music card">
        &times;
    </button>

    <img id="songArtwork" class="song-artwork" src="" alt="Song artwork">

    <div class="song-details">
        <p class="card-label">YOUR LATEST DISCOVERY</p>
        <h2 id="songTitle">Song Title</h2>
        <p id="songArtist">Artist</p>
        <p id="songMeta" class="song-meta"></p>

        <a id="playOnYouTube" href="#" target="_blank" rel="noopener noreferrer" hidden>
            Watch on YouTube ↗
        </a>
    </div>
</div>

    </main>

    <script src="script.js"></script>
</body>

</html>
