<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOST FREQ</title>
    <link rel="stylesheet" href="style.css">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>

<body>
    
<video id="bgVideo" autoplay muted loop playsinline>
    <source src="videos/highway.mp4" type="video/mp4">
</video>

    <header class="topbar">
        <a class="brand" href="#">LOST FREQ<span></span></a>
        <span class="track-count">SOUND WITHOUT BORDERS</span>
    </header>

    <main class="hero">
        <p class="eyebrow">YOUR NEXT OBSESSION IS A CLICK AWAY</p>

        <h1>LOST<br>FREQ</h1>

        <p class="tagline">Tune into the unknown.</p>

        <button id="discoverBtn">Discover a song ↗</button>

        <section class="song-info">
            <h2 id="songTitle">Nothing playing yet</h2>
            <p id="songArtist">Your next discovery awaits.</p>

            <a id="playOnYouTube"
               href="#"
               target="_blank"
               rel="noopener noreferrer"
               hidden>
                Watch on YouTube ↗
            </a>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
